<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Preferencias </title>
    </head>
    <body>
        <h1> Preferências </h1>
        <form action="index.html" method="post">
            <label for="nome">Nome:</label>
            <input type="text" name="nome">
            <br>
            <h2> Qual Turno você prefere?</h2>
            <label for="Turno"></label>
            <input type="radio" name="Turno"> Manhã
            <br>
            <label for="Turno"></label>
            <input type="radio" name="Turno"> Tarde
            <br>
            <label for="Turno"></label>
            <input type="radio" name="Turno"> Noite
            <br>
            <h2> Quais tecnologias tem interece? </h2>
            <label for="caixa"></label>
            <input type="checkbox" name="caixa"> Programação
            <br>
            <label for="caixa"></label>
            <input type="checkbox" name="caixa"> Design
            <br>
            <label for="caixa"></label>
            <input type="checkbox" name="caixa"> Banco de dados
            <br>
            <label for="caixa"></label>
            <input type="checkbox" name="caixa"> Redes
            <br>
            <br>
            <h2> Qual sua cor favorita? </h2>
            <label for="cor"></label>
            <input type="color" name="cor">
            <br>
            <br>
            <h2>Nivel de satisfação</h2>
            <label for="barra"></label>
            <input type="range" name="barra">
            <br>
            <br>
            <h2> Qual Horário prefirido?</h2>
            <label for="tempo"></label>
            <input type="time" name="tempo">
            <br>
            <br>
            <h3> Envie um arquivo </h3><label for="arquivo"></label><input type="file" name="arquivo">
            <br>
            <br>
            <input type="submit">
            <input type="reset">
        </form>
    </body>
</html>
