<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title> Cadastro </title>
    </head>
    <body>

            <input type="text" id="nome" name="login">
            <br>
            <br>

            <textarea id="texto" name="texto" ></textarea>
            <br>
            <br>

            <input type="submit">
            <input type="reset">
